name: PCI-Staging - Deployment

on:
  workflow_dispatch:
    inputs:
      deploy_version:
        description: "Select RPM version to deploy"
        required: true
        type: choice
        options:
          - 26.0.02-19
          - 25.0.03-18
          - 25.0.03-17
          - 25.0.03-16
          - 25.0.03-15
          - 25.0.03-14
          - 25.0.03-13
          - 25.0.03-12
          - 25.0.03-11
          - 25.0.03-10
          
permissions:
  contents: read
  id-token: write   

jobs:
  PCI_Staging:
    outputs:
      command_id: ${{ steps.send-ssm.outputs.command_id }}
      instance_id: ${{ steps.set-instance-id.outputs.instance_id }}
    runs-on: ubuntu-latest
    environment: pci-staging
    steps:
      - name: Configure AWS Credentials
        id: creds
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.IAM_ROLE }}
          role-session-name: pci_staging_actions
          aws-region: ${{ secrets.AWS_REGION }}
          output-credentials: true

      - name: Set Instance ID as Output
        id: set-instance-id
        run: echo "instance_id=${{ vars.STAGING_INSTANCE_ID }}" >> "$GITHUB_OUTPUT"

      - name: Send Multi-Line Script to SSM
        id: send-ssm
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --targets '[{"Key":"InstanceIds","Values":["${{ vars.STAGING_INSTANCE_ID }}"]}]' \
            --parameters commands='#!/bin/bash
              echo Running multiple commands
              sudo yum clean all
              sudo yum check-update
              sudo yum -y remove cup-ecomm-greenzone
              sudo yum -y install cup-ecomm-greenzone-${{ github.event.inputs.deploy_version }}' \
            --region ${{ secrets.AWS_REGION }} \
            --query "Command.CommandId" \
            --output text)
          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"
        
      - name: Wait for Command Completion
        id: wait-for-command-completion
        run: |
          STATUS="InProgress"
          while [[ "$STATUS" == "InProgress" || "$STATUS" == "Pending" ]]; do
            sleep 5
            STATUS=$(aws ssm list-commands \
              --command-id "${{ steps.send-ssm.outputs.command_id }}" \
              --query "Commands[0].Status" \
              --output text)
            echo "Current Status: $STATUS"
          done

          if [[ "$STATUS" != "Success" ]]; then
            echo "SSM command failed with status: $STATUS"
            echo "command_status=$STATUS" >> "$GITHUB_OUTPUT"
            exit 1
          else
            echo "command_status=Success" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch SSM Command Logs
        if: always() 
        id: fetch-logs
        run: |
          echo "Fetching logs for Command ID: ${{ steps.send-ssm.outputs.command_id }}"

          STATUS=$(aws ssm get-command-invocation \
            --command-id "${{ steps.send-ssm.outputs.command_id }}" \
            --instance-id "${{ steps.set-instance-id.outputs.instance_id }}" \
            --region ${{ secrets.AWS_REGION }} \
            --query "Status" \
            --output text)

          STDOUT=$(aws ssm get-command-invocation \
            --command-id "${{ steps.send-ssm.outputs.command_id }}" \
            --instance-id "${{ steps.set-instance-id.outputs.instance_id }}" \
            --region ${{ secrets.AWS_REGION }} \
            --query "StandardOutputContent" \
            --output text)

          STDERR=$(aws ssm get-command-invocation \
            --command-id "${{ steps.send-ssm.outputs.command_id }}" \
            --instance-id "${{ steps.set-instance-id.outputs.instance_id }}" \
            --region ${{ secrets.AWS_REGION }} \
            --query "StandardErrorContent" \
            --output text)

          # Console log
          echo "Status: $STATUS"
          echo "----- STDOUT -----"
          echo "$STDOUT"
          echo "----- STDERR -----"
          echo "$STDERR"

          # GitHub summary output
          {
            echo "## SSM Command Logs"
            echo "**Command ID:** ${{ steps.send-ssm.outputs.command_id }}"
            echo "**Status:** $STATUS"
            echo "**Deploy Version:** ${{ github.event.inputs.deploy_version }}"
            echo ""
            echo "### Standard Output"
            echo '```'
            echo "$STDOUT"
            echo '```'
            echo ""
            echo "### Standard Error"
            echo '```'
            echo "$STDERR"
            echo '```'
          } >> $GITHUB_STEP_SUMMARY
